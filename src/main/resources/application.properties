# ========== H2\u914D\u7F6E\uFF08\u5F53\u524D\u9ED8\u8BA4\u4F7F\u7528\uFF09 ==========
#spring.datasource.url=jdbc:h2:mem:poll;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:file:./poll;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA\u914D\u7F6E
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# ==========================================

# \u65E5\u5FD7\u914D\u7F6E
logging.level.cn.wildfirchat=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# \u91CE\u706BIM\u670D\u52A1\u914D\u7F6E
im.server.admin_url=http://localhost:18080
im.server.admin_secret=123456

